name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - "doc/**"
      - "install.sh"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "doc/**"
      - "install.sh"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mintlify export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install Mintlify CLI
        run: npm install -g mint

      - name: Validate docs
        working-directory: doc
        run: mint validate

      - name: Check docs links
        working-directory: doc
        run: mint broken-links

      - name: Export docs
        working-directory: doc
        run: |
          mkdir -p ../_site
          mint export --output ../_site/local-whisper-docs.zip
          unzip -q ../_site/local-whisper-docs.zip -d ../_site
          rm ../_site/local-whisper-docs.zip
          cp ../install.sh ../_site/install.sh

      - name: Prepare project Pages paths
        run: node doc/scripts/prepare-github-pages.mjs _site "/${{ github.event.repository.name }}"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
